<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/landing.css">
  <script src="js/landing.js" defer></script>
</head>
<body class="landing">
  <div class="landing-bg" aria-hidden="true">
    <div class="landing-bg-layer landing-bg-layer--far"></div>
    <div class="landing-bg-layer landing-bg-layer--mid"></div>
    <div class="landing-bg-layer landing-bg-layer--near"></div>
    <div class="landing-bg-glow"></div>
    <canvas class="landing-bg-rain"></canvas>
  </div>

  <header class="site-header">
    <div class="site-header-inner">
      <h1 class="site-title"><a href="index.html">My Apps</a></h1>
    </div>
  </header>

  <main>
    <section class="landing-hero">
      <h1>Apps</h1>
      <p>Explore the apps I publish online and on the iOS App Store.</p>
    </section>

    <div class="app-grid">
      <a href="mixpoker.html" class="app-card">
        <div class="app-card-icon">
          <img src="assets/mixpokericon.png" alt="Mix Poker">
        </div>
        <p class="app-card-name">Mix Poker</p>
      </a>
      <a href="touchbattle.html" class="app-card">
        <div class="app-card-icon">
          <img src="icon.png" alt="TouchBattle PVP">
        </div>
        <p class="app-card-name">TouchBattle PVP</p>
      </a>
      <a href="waitlistpoker.html" class="app-card">
        <div class="app-card-icon">
          <img src="assets/icon.png" alt="WaitlistPoker">
        </div>
        <p class="app-card-name">WaitlistPoker</p>
      </a>
      <a href="tonerai.html" class="app-card">
        <div class="app-card-icon">
          <img src="assets/tonerai-hero.png" alt="TonerAI">
        </div>
        <p class="app-card-name">TonerAI</p>
      </a>
      <a href="chairgrab.html" class="app-card">
        <div class="app-card-icon">
          <img src="assets/Chairgrab Logo.png" alt="ChairGrab">
        </div>
        <p class="app-card-name">ChairGrab</p>
      </a>
      <a href="sleepingbeasts.html" class="app-card">
        <div class="app-card-icon">
          <img src="assets/sleepingbeasts-icon.png" alt="Beast Safari">
        </div>
        <p class="app-card-name">Beast Safari</p>
      </a>
      <a href="branchsolve.html" class="app-card">
        <div class="app-card-icon">
          <img src="assets/branchsolve-icon.png" alt="Branchsolve">
        </div>
        <p class="app-card-name">Branchsolve</p>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>© 2026 PingSolve LLC</span>
    </div>
  </footer>
</body>
</html>
